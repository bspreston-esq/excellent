name: Release to PyPI and COPR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read merge commit message
        id: msg
        run: echo "message=$(git log -1 --format=%B)" >> "$GITHUB_OUTPUT"

      - name: Detect release mode
        id: detect
        env:
          MESSAGE: ${{ steps.msg.outputs.message }}
        run: |
          if echo "$MESSAGE" | grep -q '\[skip release\]'; then
            MODE=skip
          elif echo "$MESSAGE" | grep -q 'chore(release):'; then
            MODE=publish
          elif echo "$MESSAGE" | grep -Eq '^(feat|fix|chore)(\(.*\))?!?:'; then
            MODE=bump
          else
            MODE=skip
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Bump version and open release PR
        if: steps.detect.outputs.mode == 'bump'
        timeout-minutes: 20
        run: |
          BUMP=patch
          if echo "$MESSAGE" | grep -q 'BREAKING CHANGE' || echo "$MESSAGE" | grep -Eq '^(feat|fix|chore)(\(.*\))?!:'; then
            BUMP=major
          elif echo "$MESSAGE" | grep -Eq '^feat(\(.*\))?:'; then
            BUMP=minor
          fi
          CURRENT=$(grep -oP '^version = "\K[0-9.]+' pyproject.toml)
          NEW=$(python3 - "$CURRENT" "$BUMP" <<'PYEOF'
          import sys
          cur, bump = sys.argv[1], sys.argv[2]
          maj, mi, pa = (int(x) for x in cur.split("."))
          if bump == "major":
              print(f"{maj + 1}.0.0")
          elif bump == "minor":
              print(f"{maj}.{mi + 1}.0")
          else:
              print(f"{maj}.{mi}.{pa + 1}")
          PYEOF
          )
          BRANCH="release/v$NEW"
          if git ls-remote --heads origin "$BRANCH" | grep -q .; then
            echo "Release branch $BRANCH already exists; skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          sed -i -E "s/^version = \".*\"/version = \"$NEW\"/" pyproject.toml
          sed -i -E "s/^Version: .*/Version: $NEW/" triumphant.spec
          git add pyproject.toml triumphant.spec
          git commit -m "chore(release): v$NEW [skip release]"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore(release): v$NEW" --body "Automated version bump to $NEW. [skip release]"
          PR=$(gh pr view "$BRANCH" --json number -q .number)
          gh pr checks "$PR" --watch --interval 15
          gh pr merge "$PR" --merge
        env:
          MESSAGE: ${{ steps.msg.outputs.message }}

  publish:
    needs: release
    if: needs.release.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/triumphant
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VER=$(grep -oP '^version = "\K[0-9.]+' pyproject.toml)
          git tag -a "v$VER" -m "triumphant v$VER"
          git push origin "v$VER"

      - name: Trigger COPR build
        if: ${{ secrets.COPR_API_TOKEN != '' && vars.COPR_PROJECT != '' }}
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_API_TOKEN }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
        run: |
          python -m pip install -q copr-cli
          mkdir -p "$HOME/.config"
          cat > "$HOME/.config/copr" <<EOF
          [copr-cli]
          login = $COPR_LOGIN
          token = $COPR_TOKEN
          copr_url = https://copr.fedorainfracloud.org
          EOF
          copr-cli buildpkg "$COPR_PROJECT" triumphant
